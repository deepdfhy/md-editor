name: Release

# 打 tag 就自动出 Windows 绿色版并挂到 Release 上。
# 用法：改 package.json 的 version → git commit → git tag v0.1.11 → git push --tags
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发（用于验证流水线）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端（vite）
        run: npm run build

      - name: 打包绿色版（electron-builder）
        run: npx electron-builder --win portable --publish never

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          generate_release_notes: true
          body: |
            下载下面的 `MD 编辑器 x.y.z.exe`，双击即用（绿色版，免安装）。

            > 首次运行会解压到临时目录，稍等几秒即可。
